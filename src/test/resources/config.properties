# Common defaults for every environment.
# Resolution order (first match wins):
#   1. JVM system property       -Dkey=value   (mvn passes these through)
#   2. config-<env>.properties   chosen with -Denv=qa|staging (default qa)
#   3. this file
# Secrets are NOT read from here - see ConfigReader.secret() and .env.example.

# Browser: chrome | firefox | edge
browser=chrome
# Y = headless, N = visible window
isHeadless=N
window.width=1920
window.height=1080

# Timeouts (seconds)
explicit.wait.seconds=10
page.load.timeout.seconds=30
api.timeout.seconds=30

# Parallel scenarios (data-provider thread pool). Invalid values fall back to 2.
threadCount=2

# Retry of NORMAL failures (browser crashes are always retried, see RetryAnalyzer)
isRetry=false
retryCount=1
